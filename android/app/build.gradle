plugins {
    id 'com.android.application'
}

android {
    namespace 'com.littlesteps.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.littlesteps.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Copies the game from ../web into the app's assets before every build, so web/ stays the single source of truth.
tasks.register('syncWeb', Copy) {
    from "$rootDir/../web"
    into "$projectDir/src/main/assets"
}
preBuild.dependsOn 'syncWeb'
