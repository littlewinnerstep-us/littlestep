name: Deploy Web & OTA Updates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate neural voice clips
        run: |
          pip install --quiet edge-tts
          python3 voice-tools/make_voices.py
      - name: Stamp build version and time
        run: |
          python3 -c '
          import os, datetime
          tz = datetime.timezone(datetime.timedelta(hours=7))
          built = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M WIB")
          ver = os.environ["GITHUB_SHA"][:7]
          p = "web/index.html"
          s = open(p, encoding="utf-8").read()
          s = s.replace("const BUILD_INFO={ver:\x27local\x27,built:\x27dev\x27};", f"const BUILD_INFO={{ver:\x27{ver}\x27,built:\x27{built}\x27}};")
          open(p, "w", encoding="utf-8").write(s)
          print("Stamped:", ver, built)
          '
      - name: Generate version.json manifest
        run: |
          python3 -c '
          import json, os
          files = []
          for root, _, names in os.walk("web"):
              for n in sorted(names):
                  if n == "version.json":
                      continue
                  rel = os.path.relpath(os.path.join(root, n), "web").replace(os.sep, "/")
                  files.append(rel)
          with open("web/version.json", "w", encoding="utf-8") as f:
              json.dump({"version": os.environ["GITHUB_SHA"], "files": sorted(files)}, f, indent=2)
          print("Manifest files:", len(files))
          '
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
