name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate neural voice clips
        working-directory: .
        run: |
          pip install --quiet edge-tts pillow
          python3 voice-tools/make_voices.py
      - name: Clean app icon background
        working-directory: .
        run: |
          python3 -c '
          from PIL import Image
          import os
          src = "android/app/src/main/res/drawable-nodpi/ic_launcher.jpg"
          dst = "android/app/src/main/res/drawable-nodpi/ic_launcher.png"
          if os.path.exists(src):
              im = Image.open(src).convert("RGBA")
              w, h = im.size
              px = im.load()
              bg = px[0, 0][:3]
              visited = bytearray(w * h)
              stack = [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]
              for x, y in stack:
                  visited[y * w + x] = 1
              while stack:
                  x, y = stack.pop()
                  r, g, b, _ = px[x, y]
                  if abs(r - bg[0]) + abs(g - bg[1]) + abs(b - bg[2]) < 75:
                      px[x, y] = (0, 0, 0, 0)
                      for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                          if 0 <= nx < w and 0 <= ny < h and not visited[ny * w + nx]:
                              visited[ny * w + nx] = 1
                              stack.append((nx, ny))
              bbox = im.getbbox()
              if bbox:
                  im = im.crop(bbox)
              im = im.resize((512, 512), Image.LANCZOS)
              im.save(dst, "PNG")
              os.remove(src)
              print("Saved clean transparent icon:", dst)
          '
      - name: Copy web assets into Android
        working-directory: .
        run: |
          mkdir -p android/app/src/main/assets
          cp web/index.html android/app/src/main/assets/
          if [ -d web/voice ]; then cp -r web/voice android/app/src/main/assets/; fi
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LittleSteps-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
