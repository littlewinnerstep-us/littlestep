<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E8">
<title>Little Steps</title>
<style>
:root{--bg:#F5F1E8;--card:#FFFDF8;--ink:#3D405B;--soft:#7A7D96;--teal:#5B9A8B;--teal2:#D7E9E4;--sun:#E9C46A;--sun2:#FBF0D5;--sky:#8AB6D6;--sky2:#E3EEF6;--rose:#E5989B;--rose2:#F8E3E3;--line:#E6E0D2;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{min-height:100vh;max-width:820px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;background:none}
h1{font-size:28px;margin:6px 0}h2{font-size:23px;margin:4px 0}p{font-size:18px;line-height:1.4;margin:8px 0}
.c{text-align:center}.soft{color:var(--soft)}.huge{font-size:96px;line-height:1.1}
.btn{display:block;background:var(--teal);color:#fff;border-radius:999px;padding:16px 28px;font-size:22px;font-weight:800;box-shadow:0 4px 0 #477a6e;min-height:62px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #477a6e}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sun{background:var(--sun);color:#2B2D42;box-shadow:0 4px 0 #c9a54e}
.btn.sm{font-size:18px;min-height:50px;padding:10px 22px}
.btn.wide{width:100%;margin-top:12px}
.card{background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:18px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.icon-btn{width:56px;height:56px;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:26px;display:grid;place-items:center;flex:none}
.break-btn{width:auto;padding:0 14px;display:flex;gap:6px;align-items:center;background:var(--rose2);border-color:var(--rose);font-size:24px}
.break-btn span{font-size:16px;font-weight:800}
.break-btn.nudge{animation:glowr 1.2s infinite}
@keyframes glowr{50%{box-shadow:0 0 0 8px var(--rose2)}}
.tokens{flex:1;display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.top .tokens{flex-wrap:nowrap;min-width:0}
.tok{flex:0 1 32px;min-width:0;aspect-ratio:1;border-radius:50%;border:2px dashed var(--sun);display:grid;place-items:center;font-size:15px;line-height:1;overflow:hidden;background:var(--card)}
.tok.on{border-style:solid;background:var(--sun2)}
.goal{font-size:24px;margin-left:2px}
.tokens.lg{flex:none;flex-wrap:nowrap}.tokens.lg .tok{flex:0 0 44px;width:44px;font-size:24px}
.ttl{font-size:15px;color:var(--soft);font-weight:800;margin:0 4px 6px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px}
.prompt{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.prompt .say{width:54px;height:54px;border-radius:50%;background:var(--sky2);font-size:24px;flex:none}
.prompt .txt{font-size:22px;font-weight:700;line-height:1.3}
.prompt .pe{font-size:34px;vertical-align:middle}
.area{flex:1}
.grid{display:grid;gap:12px;grid-template-columns:repeat(var(--c,3),1fr)}
.opt{position:relative;background:var(--card);border:3px solid var(--line);border-radius:var(--r);min-height:96px;font-size:52px;display:grid;place-items:center;padding:8px;line-height:1.1}
.grid.c4{gap:8px}.grid.c4 .opt{font-size:40px;min-height:80px;padding:4px}
.opt.txt{font-size:19px;font-weight:700;min-height:68px;text-align:left;padding:14px 18px;display:flex;gap:12px;align-items:center}
.opt.txt .fe{font-size:38px}
.opt.num{font-size:44px;font-weight:800}
.opt.ok{border-color:var(--teal);background:var(--teal2)}
.opt.nope{animation:wob .4s}
.opt.hint{border-color:var(--sun);animation:glow 1.2s infinite}
@keyframes wob{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes glow{50%{box-shadow:0 0 0 8px var(--sun2)}}
.target{font-size:96px;text-align:center;margin:4px 0 12px;line-height:1.1}
.countbox{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font-size:44px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.addrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-bottom:14px}
.addrow .countbox{font-size:30px;gap:6px;margin:0;padding:10px}.plus{font-size:36px;font-weight:800}
.patrow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.patrow span{width:56px;height:56px;display:grid;place-items:center;font-size:36px;background:var(--card);border:2px solid var(--line);border-radius:16px}
.patrow .q{border:3px dashed var(--sun);color:var(--soft);font-weight:800;font-size:28px}
.slots{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:8px;margin-bottom:16px}
.slot{min-height:96px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:34px;position:relative;padding:18px 2px 6px}
.slot b{position:absolute;top:4px;left:8px;font-size:14px;color:var(--soft)}
.slot small,.opt small{font-size:13px;font-weight:700;text-align:center;line-height:1.15;color:var(--ink)}
.slot.fill{border-style:solid;border-color:var(--teal);background:var(--teal2)}
.k5 .slot{font-size:26px}.k5 .slot small{font-size:10px}
.opt.step{display:flex;flex-direction:column;font-size:40px;align-items:center;justify-content:center;gap:4px;min-height:106px}
.opt.used{visibility:hidden}
.opt.mem{min-height:84px;font-size:44px;background:var(--sky2);border-color:var(--line);color:var(--sky)}
.opt.mem.up{background:var(--card);color:var(--ink)}
.opt.mem.ok{background:var(--teal2)}
.sortitem{font-size:104px;text-align:center;margin:6px 0 2px;line-height:1.15}
.left{text-align:center;color:var(--soft);font-weight:800;margin-bottom:12px;font-size:17px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt.bin{display:flex;flex-direction:column;min-height:130px;font-size:46px;gap:6px}
.opt.bin small{font-size:20px}
.badge{position:absolute;top:6px;right:8px;background:var(--teal);color:#fff;border-radius:50%;width:28px;height:28px;font-size:16px;font-weight:800;display:grid;place-items:center}
.breathe-wrap{display:grid;place-items:center;height:230px}
.bcircle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d9ede7,#8cc0b2);transform:scale(.55);transition:transform 4s ease-in-out}
.bcircle.big{transform:scale(1)}
.btext{text-align:center;font-size:24px;font-weight:800;min-height:32px}
.timer{position:relative;width:150px;height:150px;margin:6px auto}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.tbg{fill:none;stroke:var(--line);stroke-width:12}
.tfg{fill:none;stroke:var(--sky);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.73;transition:stroke-dashoffset 1s linear}
.tnum{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:800}
.cc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cc button{background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:10px 2px;font-size:30px;display:flex;flex-direction:column;align-items:center;gap:2px}
.cc button span{font-size:13px;font-weight:800}
.cc .sel{border-color:var(--sky);background:var(--sky2)}
.calm-area{height:260px;border-radius:var(--r);margin:12px 0 4px;position:relative;overflow:hidden;background:var(--sky2)}
.calm-area .breathe-wrap{height:205px}.calm-area .bcircle{width:175px;height:175px}
.calm-hint{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:20px;font-weight:800;color:var(--soft)}
.calm-hint.light{color:#c9d3e6;place-items:start center;padding-top:14px;font-size:16px}
.bub{position:absolute;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#cfe2f0 55%,#9cc3df);border:2px solid #fff;animation:floaty 5s ease-in-out infinite alternate}
@keyframes floaty{to{transform:translateY(-26px)}}
.starsky{background:#2f3e5c}
.tapstar{position:absolute;font-size:34px;transform:translate(-50%,-50%);animation:fadeStar 3s forwards;pointer-events:none}
@keyframes fadeStar{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0}}
.move{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;padding:10px}
.move .em{font-size:84px;line-height:1}.move .mt{font-size:22px;font-weight:800;text-align:center}
.ft{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:18px 0}
.ftc{background:var(--bg);border:3px solid var(--line);border-radius:var(--r);padding:14px 6px;text-align:center;font-size:46px}
.ftc b{display:block;font-size:14px;color:var(--soft);letter-spacing:.1em}
.ftc span{display:block;font-size:17px;font-weight:800}
.ftc.done{opacity:.6}.ftc.now{border-color:var(--teal);background:var(--teal2)}
.arrow{font-size:30px;color:var(--soft)}
.plan{display:flex;flex-direction:column;gap:8px;margin:12px 0 10px}
.pi{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-size:20px;font-weight:700}
.pi .e{font-size:32px}.pi .ck{margin-left:auto;font-size:24px}
.pi.now{border-color:var(--teal);border-width:3px;background:var(--teal2)}
.pi.done{opacity:.55}
.pb{align-self:center;font-size:14px;color:var(--soft);font-weight:800;background:var(--sky2);padding:4px 14px;border-radius:99px}
.hello{display:flex;align-items:center;gap:14px}.hello>div:last-child{flex:1}
.av{width:72px;height:72px;border-radius:50%;background:var(--sun2);border:3px solid var(--sun);display:grid;place-items:center;font-size:42px;flex:none;animation:bob 3s ease-in-out infinite}
.av.wig{animation:dance .8s}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes dance{0%{transform:scale(1)}25%{transform:translateY(-14px) rotate(-12deg) scale(1.15)}50%{transform:translateY(0) rotate(10deg) scale(1.1)}75%{transform:translateY(-8px) rotate(-6deg)}100%{transform:none}}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--teal)}
.mission{margin:16px 0;text-align:center}.mission .big{font-size:76px;line-height:1.15}
.daynum{font-size:14px;font-weight:800;color:var(--teal);letter-spacing:.08em;text-transform:uppercase}
.parts{display:flex;flex-direction:column;gap:10px;margin:12px 0 8px}
.part{display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);border:3px solid var(--line);border-radius:20px;padding:10px 14px;min-height:72px}
.part .pic{font-size:38px}.part .ptx{flex:1;display:flex;flex-direction:column}.part .ptx b{font-size:20px}.part .ptx small{font-size:14px;color:var(--soft);font-weight:700}
.part .pgo{font-size:17px;font-weight:800;color:var(--soft)}
.part.next{border-color:var(--teal);background:var(--teal2)}
.part.next .pgo{background:var(--teal);color:#fff;border-radius:99px;padding:8px 14px;box-shadow:0 3px 0 #477a6e}
.part.done{opacity:.7}.part.done .pgo{font-size:26px}
.picons{display:flex;justify-content:center;gap:8px;font-size:28px;margin:10px 0 6px;flex-wrap:wrap}
.nav{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.nav button{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 2px;font-size:28px;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav span{font-size:13px;font-weight:800}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.games button{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px 6px;font-size:40px;display:flex;flex-direction:column;align-items:center;gap:2px}
.games b{font-size:17px}.games small{font-size:13px;color:var(--soft);font-weight:800}
.wk{margin:16px 0 6px;font-weight:800;font-size:15px;color:var(--soft)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dc{aspect-ratio:1;border-radius:12px;background:var(--line);color:var(--soft);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0}
.dc.done{color:#2B2D42;font-size:22px}
.dc.cur{background:var(--teal);color:#fff;font-size:18px}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.sk{color:#2B2D42;border:2px solid var(--line);border-radius:18px;text-align:center;font-size:42px;padding:8px 0 6px;animation:bob 3.4s ease-in-out infinite}
.sk small{display:block;font-size:12px;color:#5C5F78;font-weight:800}
.sk.dance,.dc.dance,.rst.dance{animation:dance .8s}
.rst{display:inline-grid;place-items:center;width:170px;height:170px;border-radius:50%;font-size:104px;border:4px solid #fff;box-shadow:0 6px 0 var(--line);margin:10px 0;animation:popin .6s,bob 3s ease-in-out .6s infinite}
.spark{position:fixed;font-size:22px;pointer-events:none;z-index:70;animation:burst .8s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) rotate(var(--a)) translateY(0) scale(.4);opacity:1}to{transform:translate(-50%,-50%) rotate(var(--a)) translateY(-90px) scale(1.1);opacity:0}}
.sec{margin-top:14px}.sec h2{font-size:19px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:17px}
.row:last-child{border-bottom:0}
select,input{font:inherit;font-size:17px;padding:9px 10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}
input[type=checkbox]{width:28px;height:28px;accent-color:var(--teal)}
.tw{overflow-x:auto}
.skr{padding:9px 0;border-bottom:1px solid var(--line)}.skh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:16px}.skr small{color:var(--soft);font-size:13px;font-weight:700}.lv{font-weight:400;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--soft);font-size:12px}
.lv{display:inline-flex;align-items:center;gap:4px}.lv button{width:30px;height:30px;border-radius:9px;background:var(--bg);border:2px solid var(--line);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--bg);border-radius:14px;padding:12px;font-size:14px;color:var(--soft);font-weight:700}.stat b{display:block;font-size:26px;color:var(--ink)}
.danger{background:var(--rose)!important;box-shadow:0 4px 0 #b97477!important;color:#fff!important}
.hold{width:190px;height:190px;border-radius:50%;margin:30px auto;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--p,0) * 1%),var(--line) 0);touch-action:none}
.hold span{width:150px;height:150px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:22px;font-weight:800}
.lab{display:block;font-weight:800;margin:14px 0 8px;color:var(--soft)}
.lab:first-child{margin-top:0}
.fieldname{width:100%;font-size:22px}
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avs button,.seg button{background:var(--bg);border:3px solid var(--line);border-radius:18px;padding:10px 0;font-size:40px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg button{font-size:19px;font-weight:800;padding:16px 0}
.avs .sel,.seg .sel{border-color:var(--teal);background:var(--teal2)}
.ovl{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;text-align:center;padding:20px}
.cheer{font-size:92px;line-height:1.1;animation:popin .5s}
.cheer .bud{display:inline-block;animation:hop .6s 3}
.cheer .st{display:inline-block;font-size:64px;animation:spin 1s}
@keyframes hop{50%{transform:translateY(-22px)}}
@keyframes spin{from{transform:rotate(-180deg) scale(.2)}}
@keyframes popin{from{transform:scale(.5);opacity:0}}
.lvup{background:var(--sun2);border:2px solid var(--sun);border-radius:99px;padding:6px 16px;font-weight:800;margin-top:6px}
.ovl .btns{width:100%;max-width:340px;margin-top:8px}
.conf{position:fixed;top:-50px;font-size:28px;animation:fall 3.4s linear forwards;z-index:60;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(200deg)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.tgs{display:flex;gap:6px;flex:none}
.tg{position:relative;width:42px;height:42px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:20px;display:grid;place-items:center;padding:0;min-width:0}
.tg.off{opacity:.5}
.tg.off::after{content:'';position:absolute;left:5px;right:5px;top:50%;height:3px;margin-top:-1.5px;background:var(--rose);transform:rotate(-40deg);border-radius:2px}
.hand{position:absolute;right:-4px;bottom:-16px;font-size:40px;line-height:1;pointer-events:none;z-index:3;animation:point 1s ease-in-out infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
@keyframes point{50%{transform:translate(-6px,-9px)}}
.quick{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:8px}
.quick button{min-height:42px;min-width:46px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:0 12px;font-weight:800;font-size:16px}
.lang2{display:flex;gap:4px}.quick .sel{background:var(--teal2);border-color:var(--teal)}
.wheelwrap{position:relative;width:min(100%,250px);margin:8px auto}
.wheelwrap canvas{width:100%;height:auto;display:block;border-radius:50%;touch-action:none;cursor:crosshair}
#wmark{position:absolute;width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #333,0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-50%);pointer-events:none}
.presets{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.presets button{width:42px;height:42px;border-radius:50%;border:3px solid var(--line)}
.swatch{display:inline-block;width:34px;height:34px;border-radius:10px;border:2px solid var(--line);vertical-align:middle;margin-left:8px}
input.bad{border-color:var(--rose)!important}
input[type=range]{width:55%;padding:0;accent-color:var(--teal)}
/* lively icons: every emoji is wrapped in .ea and moves gently; style, speed and on/off are settings */
@keyframes iaBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes iaWiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes iaFloat{0%,100%{transform:translate(0,0)}33%{transform:translate(2px,-4px)}66%{transform:translate(-2px,-2px)}}
@keyframes iaPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.ea{display:inline-block}
body.ia .ea{animation-duration:var(--ias,2.4s);animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-delay:var(--d,0s)}
body.ia-bounce .ea,body.ia-mixed .ea[data-k="0"]{animation-name:iaBounce}
body.ia-wiggle .ea,body.ia-mixed .ea[data-k="1"]{animation-name:iaWiggle}
body.ia-float .ea,body.ia-mixed .ea[data-k="2"]{animation-name:iaFloat}
body.ia-pulse .ea,body.ia-mixed .ea[data-k="3"]{animation-name:iaPulse}
body.ia-nogame #area .ea{animation:none!important}
.reduce *:not(.bcircle):not(.tfg),.reduce *::before{animation:none!important;transition:none!important}
</style>
</head>

<div id="app"></div>

<script>
'use strict';
/* ========= Little Steps — 365 days, 3 sessions a day, adaptive levels, English / Bahasa Indonesia, custom colour (offline, single file) ========= */

/* ---------- storage ---------- */
const KEY='littleSteps.v2';

function validHex(s){s=String(s==null?'':s).trim().replace(/^#/,'');if(!/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(s))return null;if(s.length===3)s=s.split('').map(c=>c+c).join('');return'#'+s.toUpperCase()}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgb2hex(r,g,b){return'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function mix(a,b,t){const x=hex2rgb(a),y=hex2rgb(b);return rgb2hex(x[0]+(y[0]-x[0])*t,x[1]+(y[1]-x[1])*t,x[2]+(y[2]-x[2])*t)}

function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function hsl2rgb(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return[f(0)*255,f(8)*255,f(4)*255]}
function hex2hsl(hex){const c=hex2rgb(hex).map(v=>v/255),r=c[0],g=c[1],b=c[2],mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2;let h=0,s=0;
  if(d){s=d/(1-Math.abs(2*l-1));if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return{h:h,s:s*100,l:l*100}}
const THEME_KEYS=['--bg','--card','--ink','--soft','--line','--teal2','--sun2','--sky2','--rose2'];

  const t=dark?.22:.18;
  const v={'--bg':bg,'--card':card,'--ink':ink,'--soft':mix(ink,bg,Math.max(0,sf)),'--line':mix(bg,ink,dark?.22:.14),'--teal2':mix(card,'#5B9A8B',t),'--sun2':mix(card,'#E9C46A',t),'--sky2':mix(card,'#8AB6D6',t),'--rose2':mix(card,'#E5989B',t)};

  freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=wave||'sine';o.frequency.value=f;const t=AC.currentTime+(delay||0)+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.9);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur*2)})}catch(e){}}

  win:[[523,659,784,1047,784,1047,1319],.13,'triangle'],sticker:[[659,784,988,1319],.09,'triangle'],chime:[[392,523],.18,'sine'],pop:[[880,1175],.05,'sine'],up:[[523,587,659,784,880,1047],.07,'triangle']};
function sfx(name,shift){const md=S.settings.sound;if(!md||md==='off')return;const x=SFX[name],k=Math.pow(2,(shift||0)/12),lively=md==='lively';

const CLIPS={};let CLIPAUD=null,CDB=null;
const ckey=t=>(lg()?'id|':'en|')+t;
function cdb(){return CDB||(CDB=new Promise((ok,no)=>{try{const r=indexedDB.open('littleSteps.clips',1);r.onupgradeneeded=()=>r.result.createObjectStore('c');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}}))}
function cput(k,blob){return cdb().then(d=>new Promise((ok,no)=>{const t=d.transaction('c','readwrite');blob?t.objectStore('c').put(blob,k):t.objectStore('c').delete(k);t.oncomplete=ok;t.onerror=()=>no(t.error)}))}
function cload(){return cdb().then(d=>{const q=d.transaction('c').objectStore('c').openCursor();q.onsuccess=()=>{const c=q.result;if(c){CLIPS[c.key]=URL.createObjectURL(c.value);c.continue()}}}).catch(()=>{})}
const hasClip=t=>!!(CLIPS[ckey(t)]||(window.BUNDLED&&BUNDLED[ckey(t)]));
function playClip(t){const u=CLIPS[ckey(t)]||(window.BUNDLED&&BUNDLED[ckey(t)]);if(!u)return false;try{if(CLIPAUD)CLIPAUD.pause();CLIPAUD=new Audio(u);CLIPAUD.play().catch(()=>{});duck(5)}catch(e){return false}return true}
function voiceLines(){const o=[];PRAISE.forEach(x=>o.push(X(x[0],x[1])));MISS.forEach(x=>o.push(X(x[0],x[1])));
  o.push(X('Look where the hand points.','Lihat yang ditunjuk tangan.'),X('You can take a break if you want.','Kamu boleh istirahat kalau mau.'),X('Break time! Pick something calm to do.','Waktu istirahat! Pilih kegiatan yang tenang.'));return o}
let REC=null;
async function recToggle(i){const line=voiceLines()[i];
  if(REC){const r=REC;REC=null;r.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast(X('Recording is not available here.','Perekaman tidak tersedia di sini.'));return}
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],mr=new MediaRecorder(st);
    mr.ondataavailable=e=>ch.push(e.data);
    mr.onstop=async()=>{st.getTracks().forEach(t=>t.stop());clearTimeout(mr._t);const b=new Blob(ch,{type:mr.mimeType||'audio/webm'});
      if(b.size>800){try{await cput(ckey(line),b);if(CLIPS[ckey(line)])URL.revokeObjectURL(CLIPS[ckey(line)]);CLIPS[ckey(line)]=URL.createObjectURL(b);toast(X('Saved','Tersimpan'))}catch(e){toast(X('Could not save','Gagal menyimpan'))}}
      REC=null;renderParent()};
    mr.start();mr._t=setTimeout(()=>{if(REC===mr){REC=null;mr.stop()}},8000);REC=mr;mr._i=i;renderParent()}
  catch(e){REC=null;toast(X('Microphone not allowed. Please allow it and try again.','Mikrofon tidak diizinkan. Izinkan lalu coba lagi.'))}}
function vrank(v){const n=(v.name||'').toLowerCase();let r=0;
  if(/neural|natural|premium|enhanced|wavenet|studio|online/.test(n))r+=50;if(/google|microsoft|siri|apple/.test(n))r+=10;
  if(/female|woman|samantha|aria|jenny|zira|karen|moira|tessa|libby|sonia/.test(n))r+=4;if(v.localService===false)r+=3;
  if(/espeak|compact|default/.test(n))r-=20;return r}
function voicesFor(){const c=lg()?'id':'en';return (window.speechSynthesis?speechSynthesis.getVoices():[]).filter(x=>x.lang&&x.lang.toLowerCase().replace('_','-').indexOf(c)===0).sort((a,b)=>vrank(b)-vrank(a))}
function bestVoice(){const l=voicesFor(),sv=S.settings.voiceName;return l.find(x=>x.name===sv)||l[0]||null}
function ptext(t){return String(t).replace(/!\s+/g,'! ').replace(/([.!?])\s+/g,'$1  ')}
let VWARN=0;
function voiceState(){ // 'ok' | 'none' (no speech engine) | 'nolang' (engine has no voice for the chosen language)
  if(window.AndroidTTS&&AndroidTTS.status){try{return AndroidTTS.status(lg()?'id':'en')}catch(e){}}
  if(window.AndroidTTS)return 'ok';
  if(!('speechSynthesis' in window))return 'none';
  const vs=speechSynthesis.getVoices();if(!vs.length)return 'ok';
  const c=lg()?'id':'en';return vs.some(x=>x.lang&&x.lang.toLowerCase().replace('_','-').indexOf(c)===0)?'ok':'nolang'}
function voiceMsg(st){return st==='none'?X('This device has no speech voice. Open the game in Chrome, or install a text-to-speech voice.','Perangkat ini tidak punya suara bicara. Buka game di Chrome, atau pasang suara text-to-speech.')
  :X('No voice for this language is installed. Install it in Android Settings > Text-to-speech.','Suara untuk bahasa ini belum terpasang. Pasang di Pengaturan Android > Text-to-speech.')}
function speak(t,style,force){if(!S.settings.voice||!t)return;const v=VSTYLE[style]||VSTYLE.say;let rate=v[0],pitch=v[1];
  if(S.settings.voiceStyle==='calm'){rate*=.93;pitch=1+(pitch-1)*.35}
  if(playClip(t))return;
  duck(String(t).length*.07/rate+.6);
  const st=voiceState();if(st!=='ok'&&(force||!VWARN)){VWARN=1;toast(voiceMsg(st))}
  if(window.AndroidTTS&&AndroidTTS.speak){try{if(AndroidTTS.setLang)AndroidTTS.setLang(lg()?'id':'en');if(AndroidTTS.speakWith)AndroidTTS.speakWith(String(t),rate,pitch);else AndroidTTS.speak(String(t))}catch(e){}return}
  if(!('speechSynthesis' in window))return;
  try{const code=lg()?'id':'en';
    const go=()=>{const vv=bestVoice(),parts=String(t).match(/[^.!?]+[.!?]*/g)||[String(t)];speechSynthesis.resume();
      parts.forEach((q,i)=>{if(!q.trim())return;const u=new SpeechSynthesisUtterance(q.trim());u.rate=rate*(/\?\s*$/.test(q)?.97:1);
        u.pitch=Math.max(.85,Math.min(1.15,pitch));u.volume=(style==='help'||style==='calm')?.85:1;u.lang=lg()?'id-ID':'en-US';if(vv)u.voice=vv;speechSynthesis.speak(u)})};

const MOODS={
  morning:{bpm:100,root:60,wave:'triangle',dens:.6,len:.7,lp:2600,pad:0,bass:1},   // a little playful
  afternoon:{bpm:80,root:57,wave:'sine',dens:.48,len:1,lp:2000,pad:.5,bass:1},     // soft and friendly
  evening:{bpm:60,root:55,wave:'sine',dens:.3,len:1.6,lp:1400,pad:1,bass:0}};       // very calm
const PROG=[[0,4,7],[-3,0,4],[5,9,12],[7,11,14]];                                   // I – vi – IV – V, gentle and familiar
const PENTA=[0,2,4,7,9];
const mtof=m=>440*Math.pow(2,(m-69)/12);
const MZ={on:false,mood:'morning',gain:null,filt:null,timer:null,next:0,step:0,last:12};
let PAUSED=false;
function actx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended'&&!PAUSED)AC.resume();return AC}
const mvol=()=>S.settings.music==='medium'?.2:.11;
function mnote(f,t,dur,wave,vol,pad){const c=AC,o=c.createOscillator(),g=c.createGain();o.type=wave;o.frequency.value=f;
  if(pad){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+dur*.35);g.gain.linearRampToValueAtTime(0,t+dur*1.05)}
  else{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0008,t+dur)}
  o.connect(g);g.connect(MZ.filt);o.start(t);o.stop(t+dur*1.1+.05)}
function mtick(){const c=AC;if(!c||!MZ.on)return;const M=MOODS[MZ.mood]||MOODS.morning,spb=60/M.bpm/2;
  while(MZ.next<c.currentTime+.3){const t=MZ.next,st=MZ.step,ch=PROG[Math.floor(st/8)%4],pos=st%8;
    if(pos===0){if(M.bass)mnote(mtof(M.root-12+ch[0]),t,spb*7,'sine',.32);if(M.pad)ch.forEach(x=>mnote(mtof(M.root+x),t,spb*8,'sine',.06+.08*M.pad,true))}
    if(Math.random()<(pos%2===0?M.dens:M.dens*.4)){
      const pool=ch.map(x=>x+12).concat(PENTA.map(x=>x+12),PENTA.map(x=>x+24)).filter(x=>x>=7&&x<=26);
      const near=pool.filter(x=>Math.abs(x-MZ.last)<=4&&x!==MZ.last);MZ.last=(near.length?near:pool)[Math.floor(Math.random()*(near.length?near.length:pool.length))];
      mnote(mtof(M.root+MZ.last),t,M.len,M.wave,.4)}
    MZ.next+=spb;MZ.step++}}
function musicStart(mood){try{const c=actx();
  if(!MZ.gain){MZ.filt=c.createBiquadFilter();MZ.filt.type='lowpass';MZ.gain=c.createGain();MZ.gain.gain.value=0;MZ.filt.connect(MZ.gain);MZ.gain.connect(c.destination)}
  MZ.mood=mood;MZ.filt.frequency.setTargetAtTime(MOODS[mood].lp,c.currentTime,.5);
  const g=MZ.gain.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.setTargetAtTime(mvol(),c.currentTime,MZ.on?.8:1.5);   // always fade in slowly
  if(!MZ.on){MZ.on=true;MZ.next=c.currentTime+.3;MZ.step=0;MZ.timer=setInterval(mtick,60)}}catch(e){}}
function musicStop(){if(!MZ.on)return;MZ.on=false;clearInterval(MZ.timer);try{const c=AC,g=MZ.gain.gain;g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);g.setTargetAtTime(0,c.currentTime,.35)}catch(e){}}
function duck(sec){if(!MZ.on||!MZ.gain)return;try{const c=AC,now=c.currentTime,g=MZ.gain.gain;g.cancelScheduledValues(now);g.setValueAtTime(g.value,now);g.setTargetAtTime(mvol()*.3,now,.08);g.setTargetAtTime(mvol(),now+sec,.7)}catch(e){}}

/* ---------- plan: 365 days x 3 sessions ---------- */
const themeFor=day=>THEMES[Math.floor((day-1)/7)%THEMES.length];
function partPlan(day,part,n){const r=rng(day*7919+part*613+n*31+7);
  if(part===0)return sample(r,['count','pattern','sort','find','follow','match'],n);
  if(part===1)return shuffle(r,['feelings','social',...sample(r,['sequence','follow','sort','memory'],n-2)]);
  return['calm',...sample(r,['memory','sequence','match','find','pattern','count'],n-1)]}

/* ---------- skills: level per activity, adapts to the child ---------- */
function sk(t){return S.skills[t]||(S.skills[t]={lvl:Math.min(MAXL[t],S.profile&&S.profile.age==='7-10'?3:1),h:[],n:0,m:0,sec:0})}
function record(type,lvl,m,sec,meta){const k=sk(type);const avg=k.n?k.sec/k.n:0;k.n++;k.m+=m;k.sec+=sec;
  S.log.push({d:todayStr(),day:meta.day,p:meta.p,t:type,l:lvl,s:sec,m:m});if(S.log.length>500)S.log.splice(0,S.log.length-500);
  let change=0;
  if(type!=='calm'&&S.settings.adaptive&&lvl===k.lvl){
    const clean=m===0,fast=clean&&avg>0&&sec<=avg*.8;                     // fast = clearly quicker than this child's own usual time
    k.h.push(clean?(fast?2:1):(m>=3?-1:0));if(k.h.length>5)k.h.shift();
    const h=k.h,L=h.length,last=q=>h.slice(-q);
    const up=(L>=2&&last(2).every(x=>x===2))||(L>=3&&last(3).every(x=>x>0))||(L>=5&&h.filter(x=>x>0).length>=4);
    const down=L>=2&&last(2).every(x=>x<0);                               // slow is never a reason to go down
    if(up&&k.lvl<MAXL[type]){k.lvl++;k.h=[];change=1}else if(down&&k.lvl>1){k.lvl--;k.h=[];change=-1}}
  return change}

let TASK=null;
function nope(b){b.classList.remove('nope');void b.offsetWidth;b.classList.add('nope')}
function showHint(b){if(!S.settings.tips||!b)return;b.classList.add('hint');if(!b.querySelector('.hand'))b.appendChild(el('span','hand','👆'))}
function clearHints(){$$('#area .hand').forEach(x=>x.remove());$$('#area .hint').forEach(x=>x.classList.remove('hint'))}
const colsFor=n=>n<=2?2:n===4?2:n===8?4:3;
function choiceGrid(area,opts,cols,cls=''){const g=el('div','grid c'+cols);g.style.setProperty('--c',cols);let wrong=0,done=false;
  const btns=opts.map(o=>{const b=el('button','opt '+cls,o.html);b.onclick=()=>{if(done)return;
    if(o.ok){done=true;b.classList.add('ok');TASK.success()}
    else{nope(b);TASK.miss();if(++wrong>=2)btns.forEach((x,j)=>{if(opts[j].ok)showHint(x)})}};g.appendChild(b);return b});
  area.appendChild(g);if(TASK)TASK.target=()=>done?null:btns.find((x,j)=>opts[j].ok);return g}
function numOpts(r,k,n){const ns=new Set([k]);let g=0;while(ns.size<n&&g++<80){const d=k+Math.floor(r()*5)-2;if(d>=1)ns.add(d)}let x=1;while(ns.size<n)ns.add(k+x++);

const MISS=[["Good try! Let's look again.",'Hampir! Ayo lihat lagi.'],["That's okay. Try again.",'Tidak apa-apa. Coba lagi ya.'],['Almost! You can do it.','Sedikit lagi! Kamu pasti bisa.'],['Take your time. You can do it.','Pelan-pelan saja. Kamu pasti bisa.']];
let lastHelp=0;
function helpVoice(T){setTimeout(()=>{if(TASK!==T||T.fin)return;const now=Date.now();if(now-lastHelp<2500)return;let line;
  const hand=!!document.querySelector('#area .hand');
  if(T.type==='memory')line=X('Keep going, you are doing great.','Terus ya, kamu hebat.');
  else if(hand&&!T.handSaid){T.handSaid=true;line=X("That's okay. Look where the hand points.",'Tidak apa-apa. Lihat yang ditunjuk tangan.')}
  else if(T.m>=3&&T.m%2===1)line=X("Let's listen again. ",'Ayo dengarkan lagi. ')+T.say;
  else{const p=pick(Math.random,MISS);line=X(p[0],p[1])}
  lastHelp=now;speak(line,'help')},80)}
function mountTask(o){const t=BUILD[o.type](rng(o.seed),o.lvl,o.th),m=META[o.type];
  app.innerHTML=`${o.top}<div class="ttl"><span>${m.i} ${mt(o.type)} · ${o.sub}</span>${o.tgs?toggles():''}</div>
  <div class="prompt"><button class="say" data-a="say" aria-label="${X('Say again','Ucapkan lagi')}">🔊</button><div class="txt">${t.text}</div></div><div class="area" id="area"></div>`;
  TASK={say:t.say,type:o.type,sec:o.sec||0,idle:0,m:0,fin:false,nudged:false,hinted:false,handSaid:false,target:null,onTick:o.onTick,
    miss(){this.m++;if(o.onMiss)o.onMiss();sfx('no');helpVoice(this)},
    success(){if(this.fin)return;this.fin=true;clearHints();const ch=record(o.type,o.lvl,this.m||(this.hinted?1:0),this.sec,o.meta);sfx('ok');o.onWin(ch,t.win)}};   // a hand-prompted answer does not count toward levelling up
  t.mount($('#area'));const op=pick(Math.random,lg()?OPEN_ID:OPEN_EN);setT(()=>speak(hasClip(t.say)?t.say:(op?op+' ':'')+t.say,'say'),350)}

function runTask(){const s=S.session;if(!s)return renderHome();const i=s.again?s.idx-1:s.idx;if(i<0||i>=s.plan.length){s.again=0;return advance()}
  enter('task');if(!s.again)s.phase='task';const key=i+'.'+s.rep;if(s.tKey!==key){s.tKey=key;s.tsec=0}save();
  mountTask({type:s.plan[i],lvl:s.levels[i],seed:s.day*1009+s.part*211+i*97+s.rep*7717+s.plan.length*13,th:themeFor(s.day),sec:s.tsec,
    tgs:true,top:topBar(s,`<button class="icon-btn break-btn" data-a="needBreak">✋<span>${X('Break','Istirahat')}</span></button>`),sub:X(`${i+1} of ${s.plan.length}`,`${i+1} dari ${s.plan.length}`),meta:{day:s.day,p:s.part},
    onMiss(){s.mistakes++},onTick(sec){s.tsec=sec;s.active++;if(sec%5===0)save()},
    onWin(ch,win){if(!s.again){s.idx++;if(s.idx>=s.plan.length)s.phase='end';else if(S.settings.breakSec>0){s.phase='break';s.breakLeft=s.breakTotal=S.settings.breakSec}else s.phase='task'}
      s.again=0;save();
      setT(()=>praise({ch,win,tokens:tokensHTML(s),left:s.plan.length-s.idx,again:S.settings.again&&s.plan[i]!=='calm',onNext:advance,onAgain(){s.again=1;s.rep++;save();runTask()}}),700)}})}

/* colour wheel: hue = angle, saturation = distance from centre, brightness = slider */
function mountWheel(){const cv=$('#wheel');if(!cv)return;const W=cv.width,R=W/2-2,ctx=cv.getContext('2d');
  const mark=$('#wmark'),hexIn=$('#hex'),sw=$('#sw'),lr=$('#lrng');
  let hsl=hex2hsl(validHex(S.settings.bg)||DEFBG);lr.value=Math.round(Math.max(10,Math.min(95,hsl.l)));
  const draw=()=>{const img=ctx.createImageData(W,W),d=img.data;
    for(let y=0;y<W;y++)for(let x=0;x<W;x++){const dx=x-W/2+.5,dy=y-W/2+.5,dist=Math.sqrt(dx*dx+dy*dy);if(dist>R)continue;const i=(y*W+x)*4,c=hsl2rgb((Math.atan2(dy,dx)*180/Math.PI+360)%360,dist/R*100,hsl.l);d[i]=c[0];d[i+1]=c[1];d[i+2]=c[2];d[i+3]=255}
    ctx.putImageData(img,0,0)};
  const place=()=>{const a=hsl.h*Math.PI/180,rad=hsl.s/100*R;mark.style.left=((W/2+Math.cos(a)*rad)/W*100)+'%';mark.style.top=((W/2+Math.sin(a)*rad)/W*100)+'%'};
  const commit=(hex,final)=>{S.settings.bg=hex;hexIn.value=hex;hexIn.classList.remove('bad');sw.style.background=hex;applyTheme();if(final)save()};
  const fromHsl=final=>{const c=hsl2rgb(hsl.h,hsl.s,hsl.l);commit(rgb2hex(c[0],c[1],c[2]),final)};
  const setHex=(hex,final)=>{hsl=hex2hsl(hex);lr.value=Math.round(Math.max(10,Math.min(95,hsl.l)));draw();place();commit(hex,final)};
  const pt=e=>{const rc=cv.getBoundingClientRect(),dx=(e.clientX-rc.left)/rc.width*W-W/2,dy=(e.clientY-rc.top)/rc.height*W-W/2;
    hsl.h=(Math.atan2(dy,dx)*180/Math.PI+360)%360;hsl.s=Math.min(Math.sqrt(dx*dx+dy*dy),R)/R*100;place();fromHsl(false)};
  let down=false;
  cv.addEventListener('pointerdown',e=>{down=true;try{cv.setPointerCapture(e.pointerId)}catch(x){}pt(e)});
  cv.addEventListener('pointermove',e=>{if(down)pt(e)});
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{if(down){down=false;save()}}));
  lr.addEventListener('input',()=>{hsl.l=Number(lr.value);draw();fromHsl(false)});lr.addEventListener('change',save);
  hexIn.addEventListener('input',()=>{const v=validHex(hexIn.value);if(!v){hexIn.classList.add('bad');return}
    hsl=hex2hsl(v);lr.value=Math.round(Math.max(10,Math.min(95,hsl.l)));draw();place();hexIn.classList.remove('bad');S.settings.bg=v;sw.style.background=v;applyTheme();save()});
  hexIn.addEventListener('blur',()=>{const v=validHex(S.settings.bg)||DEFBG;hexIn.value=v;hexIn.classList.remove('bad')});
  WHEEL={set:hex=>setHex(hex,true),reset:()=>{S.settings.bg=null;applyTheme();save();hsl=hex2hsl(DEFBG);lr.value=Math.round(hsl.l);draw();place();hexIn.value=DEFBG;hexIn.classList.remove('bad');sw.style.background=DEFBG}};
  draw();place();hexIn.value=validHex(S.settings.bg)||DEFBG;sw.style.background=hexIn.value}

function appearanceCard(){return `<div class="card sec"><h2>${X('Language & colour','Bahasa & warna')}</h2>
   <label class="lab">${X('Language','Bahasa')}</label>${langSeg('setlang2')}
   <label class="lab">${X('Background colour','Warna latar')}</label>
   <div class="wheelwrap"><canvas id="wheel" width="240" height="240"></canvas><div id="wmark"></div></div>
   <div class="row">${X('Brightness','Kecerahan')}<input type="range" id="lrng" min="10" max="95" step="1"></div>
   <div class="row">${X('Hex code','Kode hex')}<span><input id="hex" maxlength="7" autocomplete="off" spellcheck="false" style="width:112px;text-transform:uppercase"><span class="swatch" id="sw"></span></span></div>
   <div class="presets">${BG_PRESETS.map(c=>`<button data-a="bgp" data-v="${c[0]}" style="background:${c[0]}" aria-label="${lg()?c[2]:c[1]}" title="${lg()?c[2]:c[1]}"></button>`).join('')}</div>
   <button class="btn alt wide sm" data-a="bgreset">${X('Reset colour','Atur ulang warna')}</button></div>`}

/* stand-alone screen so the child's grown-up can reach language & colour without the hold gate */
function renderLook(){enter('look');app.innerHTML=`${topBar(null)}${appearanceCard().replace('card sec','card')}`;mountWheel()}
function renderParent(){enter('parent');const s=S.settings,p=S.profile,done=S.progress.done;const ds=Object.keys(done).map(Number).sort((a,b)=>b-a);
  const sum=k=>ds.reduce((a,d)=>a+(Number(done[d][k])||0),0);
  const opt=(arr,v)=>arr.map(([val,lab])=>`<option value="${val}"${String(val)===String(v)?' selected':''}>${lab}</option>`).join('');
  const skills=TYPES.map(t=>{const x=sk(t);return `<div class="skr"><div class="skh"><span>${META[t].i} ${mt(t)}</span><span class="lv">Level <button data-a="lvl" data-t="${t}" data-v="-1">−</button><b>${x.lvl}</b>/${MAXL[t]}<button data-a="lvl" data-t="${t}" data-v="1">+</button></span></div><small>${x.n?X(`Done ${x.n} · avg ${fmt(x.sec/x.n)} · pace ${pace(t)} · tries ${(x.m/x.n).toFixed(1)}`,`Selesai ${x.n} · rata-rata ${fmt(x.sec/x.n)} · tempo ${pace(t)} · percobaan ${(x.m/x.n).toFixed(1)}`):X('Not played yet','Belum dimainkan')}</small></div>`}).join('');
  const trace=S.log.slice(-15).reverse().map(x=>`<tr><td>${x.d.slice(5)}</td><td>${x.p===3?'🎮':PARTS[x.p].i} ${mt(x.t)}</td><td>${x.l}</td><td>${fmt(x.s)}</td><td>${x.m}</td></tr>`).join('')||`<tr><td colspan="5">${X('No tasks yet','Belum ada tugas')}</td></tr>`;
  const recent=ds.slice(0,14).map(d=>`<tr><td>${d}</td><td>${done[d].date}</td><td>${done[d].parts}/3</td><td>${done[d].m}</td><td>${done[d].breaks}</td><td>${done[d].mins}</td></tr>`).join('')||`<tr><td colspan="6">${X('No finished days yet','Belum ada hari yang selesai')}</td></tr>`;
  const allSec=S.log.reduce((a,x)=>a+x.s,0);
  app.innerHTML=`${topBar(null)}<h1>${X('Grown-ups','Orang tua')}</h1>
  ${appearanceCard()}
  <div class="card sec"><h2>${X('Child','Anak')}</h2>
   <div class="row">${X('Name','Nama')}<input data-set="name" value="${esc(p.name)}" maxlength="20" style="width:55%"></div>
   <div class="row">${X('Buddy','Teman')}<select data-set="avatar">${opt(AVATARS.map(a=>[a,a]),p.avatar)}</select></div>
   <div class="row">${X('Age group','Kelompok usia')}<select data-set="age">${opt([['4-6',X('4–6 years','4–6 tahun')],['7-10',X('7–10 years','7–10 tahun')]],p.age)}</select></div></div>
  <div class="card sec"><h2>${X('Daily missions','Misi harian')}</h2>
   <div class="row">${X('Tasks per session (3 sessions a day)','Tugas per sesi (3 sesi sehari)')}<select data-set="tasks">${opt([[3,'3'],[4,'4'],[5,'5']],s.tasks)}</select></div>
   <div class="row">${X('Break after each task','Istirahat setelah tiap tugas')}<select data-set="breakSec">${opt([[0,X('No break','Tanpa istirahat')],[30,X('30 sec','30 detik')],[60,X('1 min','1 menit')],[120,X('2 min','2 menit')],[180,X('3 min','3 menit')],[300,X('5 min','5 menit')]],s.breakSec)}</select></div>
   <div class="row">${X('Levels adapt to the child','Level menyesuaikan anak')}<input type="checkbox" data-set="adaptive"${s.adaptive?' checked':''}></div>
   <div class="row">${X('Allow "Play again"','Izinkan "Main lagi"')}<input type="checkbox" data-set="again"${s.again?' checked':''}></div>
   <div class="row">${X('One day per calendar day','Satu hari per hari kalender')}<input type="checkbox" data-set="oneDayPerDate"${s.oneDayPerDate?' checked':''}></div>
   <p class="soft" style="font-size:14px">${X('Changes apply from the next session. A level goes up after 3 tasks in a row with no mistakes (or 2 that are also faster than usual), and steps down after 2 hard ones in a row. Being slow never lowers a level.','Perubahan berlaku mulai sesi berikutnya. Level naik setelah 3 tugas berturut-turut tanpa kesalahan (atau 2 tugas yang juga lebih cepat dari biasanya), dan turun setelah 2 tugas sulit berturut-turut. Lambat tidak pernah menurunkan level.')}</p></div>
  <div class="card sec"><h2>${X('Your voice','Suaramu')}</h2>
   <p class="soft" style="font-size:14px">${X('Record these lines in your own voice (up to 8 seconds each). Your recording plays instead of the computer voice.','Rekam kalimat ini dengan suaramu (maks. 8 detik). Rekamanmu dipakai menggantikan suara komputer.')}</p>
   ${voiceLines().map((l,i)=>{const has=!!CLIPS[ckey(l)],rc=REC&&REC._i===i;return `<div class="row" style="gap:6px"><span style="flex:1;font-size:15px">${esc(l)}</span>${has?`<button class="btn sm" style="padding:6px 12px;min-height:40px;font-size:18px" data-a="clipplay" data-v="${i}" aria-label="Play">▶</button><button class="btn sm" style="padding:6px 12px;min-height:40px;font-size:18px" data-a="clipdel" data-v="${i}" aria-label="Delete">🗑</button>`:''}<button class="btn sm" style="padding:6px 12px;min-height:40px;font-size:18px;${rc?'background:#c0392b':''}" data-a="cliprec" data-v="${i}">${rc?'⏹':'🎙️'}</button></div>`}).join('')}
  </div>
  <div class="card sec"><h2>${X('Comfort','Kenyamanan')}</h2>
   <div class="row">${X('Sounds','Suara')}<select data-set="sound">${opt([['off',X('Off','Mati')],['soft',X('Soft','Pelan')],['lively',X('Lively','Ceria')]],s.sound)}</select></div>
   <div class="row">${X('Read instructions aloud','Bacakan instruksi')}<input type="checkbox" data-set="voice"${s.voice?' checked':''}></div>
   <div class="row">${X('Test the voice','Coba suara')}<button class="btn" style="padding:8px 18px;font-size:18px;min-height:44px" data-a="testvoice">🔊 ${X('Play','Putar')}</button></div>
   <div class="row">${X('Voice','Suara')}<select data-set="voiceName"><option value="">${X('Best available','Terbaik yang ada')}</option>${voicesFor().map(v=>`<option value="${esc(v.name)}"${S.settings.voiceName===v.name?' selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
   <div class="row">${X('Voice style','Gaya suara')}<select data-set="voiceStyle">${opt([['lively',X('Lively & warm','Ceria & hangat')],['calm',X('Calm & slow','Tenang & pelan')]],s.voiceStyle)}</select></div>
   <div class="row">${X('Background music','Musik latar')}<select data-set="music">${opt([['off',X('Off','Mati')],['soft',X('Soft','Pelan')],['medium',X('Medium','Sedang')]],s.music)}</select></div>
   <div class="row">${X('Pointing-hand tips','Petunjuk tangan')}<input type="checkbox" data-set="tips"${s.tips?' checked':''}></div>
   <p class="soft" style="font-size:14px">${X('Music changes with the time of day: playful in the morning, softer in the afternoon, very calm in the evening and during breaks. The hand appears after 2 wrong taps or about 10 seconds without a tap.','Musik berubah sesuai waktu: ceria di pagi hari, lebih lembut di siang hari, sangat tenang di malam hari dan saat istirahat. Tangan muncul setelah 2 ketukan salah atau sekitar 10 detik tanpa ketukan.')}</p>
   <div class="row">${X('Moving icons','Ikon bergerak')}<input type="checkbox" data-set="anim"${s.anim?' checked':''}></div>
   <div class="row">${X('Icon motion','Gerak ikon')}<select data-set="iaStyle">${opt([['mixed',X('Mixed','Campur')],['bounce',X('Bounce','Melompat')],['wiggle',X('Wiggle','Bergoyang')],['float',X('Float','Melayang')],['pulse',X('Pulse','Berdenyut')]],s.iaStyle)}</select></div>
   <div class="row">${X('Icon speed','Kecepatan ikon')}<select data-set="iaSpeed">${opt([['slow',X('Slow','Pelan')],['normal',X('Normal','Normal')],['fast',X('Fast','Cepat')]],s.iaSpeed)}</select></div>
   <div class="row">${X('Also move icons inside games','Gerakkan ikon di dalam game juga')}<input type="checkbox" data-set="iaPlay"${s.iaPlay?' checked':''}></div>
   <div class="row">${X('Calm mode (no animations)','Mode tenang (tanpa animasi)')}<input type="checkbox" data-set="reduceMotion"${s.reduceMotion?' checked':''}></div></div>
  <div class="card sec"><h2>${X('Progress','Kemajuan')}</h2>
   <div class="stats"><div class="stat"><b>${ds.length}</b>${X('days done','hari selesai')}</div><div class="stat"><b>${Math.min(S.progress.day,365)}</b>${X('current day','hari saat ini')}</div>
   <div class="stat"><b>${S.log.length?fmt(allSec/S.log.length):'–'}</b>${X('average time per task','rata-rata waktu per tugas')}</div><div class="stat"><b>${sum('breaks')+S.progress.cur.breaks}</b>${X('breaks asked','istirahat diminta')}</div></div>
   <h2 style="margin-top:14px">${X('Skills','Kemampuan')}</h2>${skills}
   <h2 style="margin-top:14px">${X('Last tasks','Tugas terakhir')}</h2><div class="tw"><table><tr><th>${X('Date','Tanggal')}</th><th>${X('Task','Tugas')}</th><th>Lv</th><th>${X('Time','Waktu')}</th><th>${X('Tries','Percobaan')}</th></tr>${trace}</table></div>
   <h2 style="margin-top:14px">${X('Recent days','Hari terakhir')}</h2><div class="tw"><table><tr><th>${X('Day','Hari')}</th><th>${X('Date','Tanggal')}</th><th>${X('Sessions','Sesi')}</th><th>${X('Tries','Percobaan')}</th><th>${X('Breaks','Istirahat')}</th><th>${X('Min','Mnt')}</th></tr>${recent}</table></div>
   <p class="soft" style="font-size:14px">${X('"Tries" are wrong taps. "Pace" compares the last 3 times with the 3 before.','"Percobaan" adalah ketukan yang salah. "Tempo" membandingkan 3 kali terakhir dengan 3 kali sebelumnya.')}</p></div>
  <div class="card sec"><h2>${X('Tools','Alat')}</h2>
   <button class="btn alt wide" data-a="unlock">${X('🔓 Unlock next day now','🔓 Buka hari berikutnya sekarang')}</button>
   <div class="row" style="margin-top:8px">${X('Go to day','Ke hari')}<input id="gday" type="number" min="1" max="365" value="${Math.min(S.progress.day,365)}" style="width:90px"><button class="btn sun sm" data-a="gotoDay">${X('Go','Pergi')}</button></div>
   ${S.session?`<button class="btn alt wide" data-a="endMission">${X('⏹ End current mission','⏹ Akhiri misi saat ini')}</button>`:''}
   <button class="btn wide danger" data-a="reset">${X('Reset all progress','Atur ulang semua kemajuan')}</button></div>`;
  mountWheel();
  $$('[data-set]').forEach(inp=>inp.addEventListener('change',()=>{const k=inp.dataset.set;let v=inp.type==='checkbox'?inp.checked:inp.value;
    if(k==='name')S.profile.name=String(v).trim().slice(0,20)||S.profile.name;
    else if(k==='age'||k==='avatar')S.profile[k]=v;
    else{if(k==='tasks'||k==='breakSec')v=Number(v);S.settings[k]=v;if(k==='music'&&v!=='off')S.settings.musicLvl=v;if(k==='voice'&&!v)hush();if(k==='voiceName')setTimeout(testVoice,100)}
    save();document.body.classList.toggle('reduce',!!S.settings.reduceMotion);applyAnim();if(k==='sound')sfx('ok');toast(X('Saved','Tersimpan'))}))}

/* ---------- actions ---------- */
const ACT={
  home:renderHome,play:renderPlay,year:renderYear,stickers:renderStickers,gate:renderGate,
  say(){if(TASK)speak(TASK.say)},
  buddy(e){dance(e);sfx('star');burst(e);const h=new Date().getHours();
    speak(X(`Good ${h<12?'morning':h<17?'afternoon':'evening'}, ${S.profile.name}!`,`Selamat ${h<11?'pagi':h<15?'siang':h<18?'sore':'malam'}, ${S.profile.name}!`))},
  part(e){const i=Number(e.dataset.v),s=S.session;if(s){if(s.part===i)return renderPlan();return toast(X('Finish your mission first 🙂','Selesaikan misimu dulu 🙂'))}
    newSession(S.progress.day,i,!!S.progress.cur.parts[i])},
  go:advance,
  needBreak(){const s=S.session;if(!s)return;s.breaks++;if(s.again){s.again=0;if(s.phase==='end')return advance()}
    s.breakLeft=s.breakTotal=S.settings.breakSec||60;s.phase='break';save();renderBreak()},
  ready:breakOver,
  resume(){const s=S.session;if(!s)return renderHome();s.phase='task';save();runTask()},
  calm(e){$$('.cc button').forEach(b=>b.classList.toggle('sel',b===e));mountCalm(e.dataset.v)},
  free(e){freePlay(e.dataset.v)},
  stk(e){const d=Number(e.dataset.v),k=stickerOf(d);dance(e);sfx('sticker',d%8);burst(e);speak(k.name)},
  av(e){SETUP.avatar=e.dataset.v;renderSetup()},
  age(e){SETUP.age=e.dataset.v;renderSetup()},
  setlang(e){setLang(e.dataset.v);renderSetup()},
  setlang2(e){const y=window.scrollY;setLang(e.dataset.v);if(CUR==='look')renderLook();else renderParent();window.scrollTo(0,y);toast(X('Saved','Tersimpan'))},
  tgl(e){const k=e.dataset.v,st=S.settings;
    if(k==='music')st.music=st.music==='off'?(st.musicLvl||'soft'):'off';else st[k]=!st[k];
    const on=tgOn(k);save();$$(`[data-a=tgl][data-v=${k}]`).forEach(b=>{b.classList.toggle('off',!on);b.setAttribute('aria-pressed',on)});
    if(k==='voice'&&!on)hush();if(k==='tips'&&!on)clearHints();if(k==='anim')applyAnim();if(k==='music')updateMusic();
    toast(tgName(k)+': '+(on?X('on','nyala'):X('off','mati')));if(k==='voice'&&on)speak(X('Hello!','Halo!'),'praise',true)},
  testvoice(){testVoice()},
  cliprec(e){recToggle(Number(e.dataset.v))},
  clipplay(e){playClip(voiceLines()[Number(e.dataset.v)])},
  clipdel(e){const k=ckey(voiceLines()[Number(e.dataset.v)]);if(CLIPS[k]){URL.revokeObjectURL(CLIPS[k]);delete CLIPS[k]}cput(k,null).then(()=>renderParent())},
  look:renderLook,
  setlang3(e){setLang(e.dataset.v);renderHome()},
  bgp(e){if(WHEEL)WHEEL.set(e.dataset.v)},
  bgreset(){if(WHEEL)WHEEL.reset()},
  begin(){const n=SETUP.name.trim();if(!n){toast(X('Please type a name','Tolong isi nama'));$('#nm').focus();return}S.profile={name:n.slice(0,20),avatar:SETUP.avatar,age:SETUP.age};save();sfx('ok');renderHome()},
  lvl(e){const t=e.dataset.t,k=sk(t);k.lvl=Math.max(1,Math.min(MAXL[t],k.lvl+Number(e.dataset.v)));k.h=[];save();e.parentNode.querySelector('b').textContent=k.lvl},
  unlock(){const P=S.progress;if(S.session)return toast(X('End the current mission first','Akhiri misi saat ini dulu'));if(P.cur.parts.some(x=>x)&&P.day<=365)closeDay(todayStr());P.lastDate=null;save();toast(X('Next day unlocked','Hari berikutnya dibuka'));renderParent()},
  gotoDay(){const n=parseInt($('#gday').value,10);if(!(n>=1&&n<=365))return toast(X('Pick a day from 1 to 365','Pilih hari 1 sampai 365'));S.progress.day=n;S.progress.cur=newCur();S.progress.lastDate=null;S.session=null;save();toast(X('Now on day '+n,'Sekarang di hari '+n));renderParent()},
  endMission(){S.session=null;save();toast(X('Mission ended','Misi diakhiri'));renderParent()},
  reset(e){if(!e.dataset.armed){e.dataset.armed='1';e.textContent=X('Tap again to erase everything','Ketuk lagi untuk menghapus semua');setT(()=>{if(e.isConnected){delete e.dataset.armed;e.textContent=X('Reset all progress','Atur ulang semua kemajuan')}},4000);return}
    S.progress=clone(DEF.progress);S.skills={};S.log=[];S.session=null;save();toast(X('Progress reset','Kemajuan diatur ulang'));renderParent()}
};
app.addEventListener('pointerdown',()=>{if(TASK)TASK.idle=0},true);
app.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!app.contains(t))return;const f=ACT[t.dataset.a];if(f)f(t)});

/* task stopwatch: counts only while a task is on screen and visible; never shown to the child */
setInterval(()=>{if(!TASK||TASK.fin||document.hidden||CUR!=='task')return;TASK.sec++;TASK.idle++;if(TASK.onTick)TASK.onTick(TASK.sec);
  if(S.settings.tips&&TASK.target&&TASK.idle>=(S.profile&&S.profile.age==='7-10'?15:10)&&!document.querySelector('#area .hand')){const tb=TASK.target();if(tb){TASK.hinted=true;TASK.handSaid=true;TASK.idle=0;showHint(tb);speak(X('Look where the hand points.','Lihat yang ditunjuk tangan.'),'help')}}
  if(!TASK.nudged&&TASK.type!=='calm'){const k=S.skills[TASK.type],avg=k&&k.n?k.sec/k.n:0;
    if(TASK.sec>=Math.max(90,avg*2.5)){TASK.nudged=true;const b=$('.break-btn');if(b){b.classList.add('nudge');speak(X('You can take a break if you want.','Kamu boleh istirahat kalau mau.'))}}}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.appPause();else window.appResume()});
window.goHome=()=>{if(CUR==='home'||CUR==='setup')return false;renderHome();return true};
window.getReport=()=>JSON.stringify({profile:S.profile,progress:S.progress,skills:S.skills,log:S.log});
document.documentElement.lang=S.settings.lang;
applyTheme();
try{if(window.AndroidTTS&&AndroidTTS.setLang)AndroidTTS.setLang(S.settings.lang)}catch(e){}
if('speechSynthesis' in window)try{speechSynthesis.getVoices()}catch(e){}
/* ---------- lively icons ---------- */
const EMO=/\p{Extended_Pictographic}[\uFE0F\u{1F3FB}-\u{1F3FF}]?(?:\u200D\p{Extended_Pictographic}[\uFE0F\u{1F3FB}-\u{1F3FF}]?)*/gu,EMOT=/\p{Extended_Pictographic}/u;
const NOEA='script,style,textarea,select,option,input,canvas,.ea,.conf,.spark,.hand,.burst,[data-noanim]';
function wrapEmoji(root){if(!S.settings.anim||!root||root.nodeType===8)return;const base=root.nodeType===3?root.parentNode:root;if(!base||!base.closest||base.closest(NOEA))return;
  const nodes=[];if(root.nodeType===3)nodes.push(root);else{const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode())if(EMOT.test(n.nodeValue)&&!(n.parentNode.closest&&n.parentNode.closest(NOEA)))nodes.push(n)}
  nodes.forEach(n=>{const t=n.nodeValue,f=document.createDocumentFragment();let last=0,m;EMO.lastIndex=0;
    while(m=EMO.exec(t)){if(m.index>last)f.appendChild(document.createTextNode(t.slice(last,m.index)));const sp=document.createElement('span');sp.className='ea';sp.dataset.k=String(Math.floor(Math.random()*4));sp.style.setProperty('--d',(-Math.random()*3).toFixed(2)+'s');sp.textContent=m[0];f.appendChild(sp);last=m.index+m[0].length}
    if(last<t.length)f.appendChild(document.createTextNode(t.slice(last)));if(n.parentNode)n.parentNode.replaceChild(f,n)})}
let EAQ=new Set(),EAR=0;
function applyAnim(){const b=document.body,s=S.settings;b.classList.toggle('ia',!!s.anim);['mixed','bounce','wiggle','float','pulse'].forEach(k=>b.classList.toggle('ia-'+k,s.iaStyle===k));
  b.classList.toggle('ia-nogame',!s.iaPlay);b.style.setProperty('--ias',({slow:'3.8s',normal:'2.4s',fast:'1.4s'})[s.iaSpeed]||'2.4s');if(s.anim)wrapEmoji(b)}
try{new MutationObserver(ms=>{if(!S.settings.anim)return;ms.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1||n.nodeType===3)EAQ.add(n)}));
  if(!EAR){EAR=1;requestAnimationFrame(()=>{EAR=0;const q=[...EAQ];EAQ=new Set();q.forEach(n=>{if(n.isConnected)wrapEmoji(n)})})}}).observe(document.body,{childList:true,subtree:true})}catch(e){}
cload();
applyAnim();
renderHome();
</script>
